# https://acraven.medium.com/a-nuget-package-workflow-using-github-actions-7da8c6557863
name: Create new release from pushed tag

on:
  push:
    tags:
      - "*"

permissions:
    contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    name: Build, Test, and Upload Builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          
      - name: Set VERSION variable from tag
        if: ${{ contains(github.ref, 'refs/tags') }}
        shell: bash
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV
        
      - name: Print VERSION variable for debugging
        shell: bash
        run: echo "$VERSION"
        
      - name: Publish for Linux x64
        if: matrix.os == 'ubuntu-latest'
        run: dotnet publish -c Release -r linux-x64 --self-contained AxeHax /p:Version=${VERSION} -o publish-x64/

      - name: Publish for Linux ARM64
        if: matrix.os == 'ubuntu-latest'
        run: dotnet publish -c Release -r linux-arm64 --self-contained AxeHax /p:Version=${VERSION} -o publish-arm64/

      - name: Publish for Windows x64
        if: matrix.os == 'windows-latest'
        shell: bash
        run: dotnet publish -c Release -r win-x64 --no-self-contained AxeHax //p:Version=${VERSION} -o publish/

      - name: Publish for macOS x64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: dotnet publish -c Release -r osx-x64 --self-contained AxeHax /p:Version=${VERSION}
  
      - name: Publish for macOS ARM64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: dotnet publish -c Release -r osx-arm64 --self-contained AxeHax /p:Version=${VERSION}
      
      - name: Create macOS universal2 binary
        if: matrix.os == 'macos-latest'
        shell: bash
        working-directory: AxeHax/bin/Release/net9.0/
        run: |
          mkdir -p osx-universal2/publish/AxeHax.app/Contents/MacOS
          cp -r osx-arm64/publish/*.app/Contents/ osx-universal2/publish/AxeHax.app/Contents/
          for file in $(find osx-arm64/publish/*.app/Contents/MacOS); do
            if [[ "$(file $file)" == *"Mach-O"* ]]; then
                if [[ "$(lipo -archs $file)" != *"x86_64 arm64"* ]]; then
                  lipo -create osx-arm64/publish/*.app/Contents/MacOS/$(basename $file) osx-x64/publish/*.app/Contents/MacOS/$(basename $file) -output osx-universal2/publish/AxeHax.app/Contents/MacOS/$(basename $file);
                fi;
            fi;
          done
          rm -rfv osx-universal2/publish/AxeHax.app/Contents/MacOS/*.app
          codesign -fs - --deep osx-universal2/publish/AxeHax.app
  
      - name: 'Tar macOS universal2 build'
        if: matrix.os == 'macos-latest'
        working-directory: AxeHax/bin/Release/net9.0/osx-universal2/publish/
        run: tar -czvf ../../../../../../AxeHax_for_macOS.tar.gz *.app
        
      - name: Package Windows x64 build
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Compress-Archive -Path .\publish\* -DestinationPath .\AxeHax_windows-x64.zip -Force

      - name: Package Linux x64 build
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          zip -r AxeHax_linux-x64.zip publish-x64

      - name: Package Linux ARM64 build
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          zip -r AxeHax_linux-arm64.zip publish-arm64

      - name: Upload Windows x64 build
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: "AxeHax_windows-x64"
          path: "AxeHax_windows-x64.zip"
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux x64 build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: "AxeHax_linux-x64"
          path: "AxeHax_linux-x64.zip"
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux ARM64 build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: "AxeHax_linux-arm64"
          path: "AxeHax_linux-arm64.zip"
          if-no-files-found: error
          retention-days: 1

      - name: Upload macOS universal2 build
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
            name: "AxeHax_for_macOS"
            path: "AxeHax_for_macOS.tar.gz"
            if-no-files-found: error
            retention-days: 1
  release:
    name: Release Built Artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -R release-artifacts

      - uses: ncipollo/release-action@v1.16.0
        name: "Create release"
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          draft: false
          generateReleaseNotes: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: |
            release-artifacts/*.zip
            release-artifacts/*.tar.gz